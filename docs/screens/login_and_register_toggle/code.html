"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-xs"></div><div class="flex items-center gap-space-sm"></div></div></header><main class="flex-1 flex flex-col relative w-full pt-14 bg-surface pb-safe"><div class="flex flex-col w-full px-margin pb-safe pt-space-lg select-none">
<!-- Brand Header & Telemetry Icon Badge -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-xl">
<div class="relative w-16 h-16 rounded-xl bg-surface-container-lowest p-space-xs shadow-md flex items-center justify-center mb-space-md">
<img alt="Photometrix IoT Mark" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1XvnSut4ZxBhFwQsuBwfpiiMYbOoN-23nhsl7fdBukHTcLZkKVLfISBhE1XniBo_maXJFe0XDzuVMS0OAy9IsxPLAU5uCvUqZ-wruBfl9jLStsfXtVfyoHzSiwQ_JjzfDmd33OXx0uMJEVYmK-_5_RT4Aa2fbX1HAovhQGPSJqXRDpHj6sDAykJ5fO49cLRWKxSHGHvyyEwVU_V8MvpEqEqR_jHJSMV5Ue85a06TpABPgTKKgJ44bcfRxA">
<span class="absolute -top-1 -right-1 flex h-3 w-3">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75"></span>
<span class="relative inline-flex rounded-full h-3 w-3 bg-secondary-container"></span>
</span>
</div>
<!-- Dynamic Header -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight" id="view-title">
      Welcome Back
    </h2>
<p class="font-label-code text-label-code text-on-surface-variant uppercase tracking-wider mt-space-xs" id="view-subtitle">
      Node Console // Facility Gateway
    </p>
</div>
<!-- Industrial Bimodal Segmented Pill Toggle -->
<div class="w-full bg-surface-container-high p-1 rounded-xl flex items-center relative mb-space-xl shadow-inner">
<button class="flex-1 py-2.5 rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-center flex items-center justify-center gap-space-xs bg-inverse-surface text-inverse-on-surface shadow-sm" id="tab-signin" onclick="switchAuthMode('signin')" type="button">
<span class="material-symbols-outlined text-base">login</span>
<span class="">Sign In</span>
</button>
<button class="flex-1 py-2.5 rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-center flex items-center justify-center gap-space-xs text-on-surface-variant hover:text-on-surface" id="tab-register" onclick="switchAuthMode('register')" type="button">
<span class="material-symbols-outlined text-base">person_add</span>
<span class="">Register</span>
</button>
</div>
<!-- Sign In Form Panel -->
<div class="flex flex-col gap-space-md transition-opacity duration-150" id="signin-panel">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between px-space-xs">
<label class="font-label-code text-label-code text-outline uppercase tracking-wider" for="signin-email">
          Auditor Identifier
        </label>
<span class="font-telemetry-sm text-telemetry-sm text-secondary-container text-[11px] font-semibold">IESNA 90.1</span>
</div>
<div class="flex items-center bg-surface-container-lowest px-space-md py-3.5 rounded-xl shadow-sm focus-within:shadow-md transition-shadow">
<span class="material-symbols-outlined text-primary text-xl mr-space-md">mail</span>
<input class="w-full bg-transparent font-telemetry-sm text-telemetry-sm text-on-surface outline-none placeholder:text-outline-variant" id="signin-email" inputmode="email" placeholder="engineer@facility.iot" type="email" value="engineer@facility.iot">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between px-space-xs">
<label class="font-label-code text-label-code text-outline uppercase tracking-wider" for="signin-password">
          Security Key
        </label>
<button class="font-label-code text-label-code text-primary hover:text-on-primary-container transition-colors" onclick="notifyForgot()" type="button">
          RECOVERY
        </button>
</div>
<div class="flex items-center bg-surface-container-lowest px-space-md py-3.5 rounded-xl shadow-sm focus-within:shadow-md transition-shadow">
<span class="material-symbols-outlined text-primary text-xl mr-space-md">lock</span>
<input class="w-full bg-transparent font-telemetry-sm text-telemetry-sm text-on-surface outline-none placeholder:text-outline-variant" id="signin-password" placeholder="••••••••••••" type="password" value="Calibrated#2024">
<button class="text-outline-variant hover:text-on-surface flex items-center justify-center p-1" onclick="togglePassVisibility('signin-password', this)" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- Telemetry Signal Status Pill Indicator -->
<div class="flex items-center justify-between bg-surface-container-low px-space-md py-2.5 rounded-lg mt-space-xs">
<div class="flex items-center gap-space-xs">
<span class="w-2 h-2 rounded-full bg-tertiary"></span>
<span class="font-label-code text-label-code text-on-surface-variant uppercase">Core BMS Telemetry Active</span>
</div>
<span class="font-label-code text-label-code text-outline">v2.4.9</span>
</div>
<!-- Action Button -->
<button class="w-full mt-space-md py-3.5 px-space-lg rounded-xl bg-inverse-surface text-inverse-on-surface hover:bg-on-surface active:scale-[0.99] font-headline-sm text-headline-sm flex items-center justify-center gap-space-sm shadow-md transition-all" onclick="simulateAuth('signin')" type="button">
<span class="">Sign In</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
<!-- Register Form Panel (Hidden by default) -->
<div class="hidden flex flex-col gap-space-md transition-opacity duration-150" id="register-panel">
<!-- Full Name Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between px-space-xs">
<label class="font-label-code text-label-code text-outline uppercase tracking-wider" for="register-name">
          Auditor Full Name
        </label>
<span class="font-label-code text-label-code text-primary">Required</span>
</div>
<div class="flex items-center bg-surface-container-lowest px-space-md py-3.5 rounded-xl shadow-sm focus-within:shadow-md transition-shadow">
<span class="material-symbols-outlined text-secondary-container text-xl mr-space-md">badge</span>
<input class="w-full bg-transparent font-telemetry-sm text-telemetry-sm text-on-surface outline-none placeholder:text-outline-variant" id="register-name" placeholder="Dr. Elena Vance" type="text">
</div>
</div>
<!-- Work Email Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between px-space-xs">
<label class="font-label-code text-label-code text-outline uppercase tracking-wider" for="register-email">
          Official Domain Address
        </label>
</div>
<div class="flex items-center bg-surface-container-lowest px-space-md py-3.5 rounded-xl shadow-sm focus-within:shadow-md transition-shadow">
<span class="material-symbols-outlined text-secondary-container text-xl mr-space-md">mail</span>
<input class="w-full bg-transparent font-telemetry-sm text-telemetry-sm text-on-surface outline-none placeholder:text-outline-variant" id="register-email" inputmode="email" placeholder="auditor@ashrae-lab.org" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between px-space-xs">
<label class="font-label-code text-label-code text-outline uppercase tracking-wider" for="register-password">
          Encryption Token
        </label>
<span class="font-label-code text-label-code text-outline">Min. 8 char</span>
</div>
<div class="flex items-center bg-surface-container-lowest px-space-md py-3.5 rounded-xl shadow-sm focus-within:shadow-md transition-shadow">
<span class="material-symbols-outlined text-secondary-container text-xl mr-space-md">shield_lock</span>
<input class="w-full bg-transparent font-telemetry-sm text-telemetry-sm text-on-surface outline-none placeholder:text-outline-variant" id="register-password" placeholder="••••••••••••" type="password">
<button class="text-outline-variant hover:text-on-surface flex items-center justify-center p-1" onclick="togglePassVisibility('register-password', this)" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- Security Tier Badge -->
<div class="flex items-center gap-space-sm bg-surface-container-high px-space-md py-2.5 rounded-lg mt-space-xs">
<span class="material-symbols-outlined text-secondary-container text-base">verified_user</span>
<p class="font-label-code text-label-code text-on-surface-variant uppercase tracking-wide">
        Role: Commissioning Engineer (Tier 3)
      </p>
</div>
<!-- Register Action Button -->
<button class="w-full mt-space-md py-3.5 px-space-lg rounded-xl bg-secondary text-on-secondary hover:opacity-95 active:scale-[0.99] font-headline-sm text-headline-sm flex items-center justify-center gap-space-sm shadow-md transition-all" onclick="simulateAuth('register')" type="button">
<span class="">Provision Node Account</span>
<span class="material-symbols-outlined text-lg">add_task</span>
</button>
</div>
<!-- Interactive Context Switch Bottom Bar -->
<div class="mt-space-xl flex flex-col items-center justify-center gap-space-xs text-center">
<div class="font-body-md text-body-md text-on-surface-variant flex items-center gap-space-xs" id="switch-prompt">
<span class="">Don't have an auditor key?</span>
<button class="font-headline-sm text-headline-sm text-primary hover:underline" onclick="switchAuthMode('register')" type="button">
        Register Node
      </button>
</div>

</div>
</div>
<script>
  function switchAuthMode(mode) {
    const tabSignin = document.getElementById('tab-signin');
    const tabRegister = document.getElementById('tab-register');
    const signinPanel = document.getElementById('signin-panel');
    const registerPanel = document.getElementById('register-panel');
    const viewTitle = document.getElementById('view-title');
    const viewSubtitle = document.getElementById('view-subtitle');
    const switchPrompt = document.getElementById('switch-prompt');

    if (mode === 'signin') {
      // Pill state
      tabSignin.className = 'flex-1 py-2.5 rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-center flex items-center justify-center gap-space-xs bg-inverse-surface text-inverse-on-surface shadow-sm';
      tabRegister.className = 'flex-1 py-2.5 rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-center flex items-center justify-center gap-space-xs text-on-surface-variant hover:text-on-surface';
      
      // Panels
      signinPanel.classList.remove('hidden');
      registerPanel.classList.add('hidden');
      
      // Headings
      viewTitle.textContent = 'Welcome Back';
      viewSubtitle.textContent = 'Node Console // Facility Gateway';

      // Footer
      switchPrompt.innerHTML = `<span>Don't have an auditor key?</span> <button type="button" onclick="switchAuthMode('register')" class="font-headline-sm text-headline-sm text-primary hover:underline">Register Node</button>`;
    } else {
      // Pill state
      tabRegister.className = 'flex-1 py-2.5 rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-center flex items-center justify-center gap-space-xs bg-secondary text-on-secondary shadow-sm';
      tabSignin.className = 'flex-1 py-2.5 rounded-lg font-headline-sm text-headline-sm transition-all duration-200 text-center flex items-center justify-center gap-space-xs text-on-surface-variant hover:text-on-surface';

      // Panels
      signinPanel.classList.add('hidden');
      registerPanel.classList.remove('hidden');

      // Headings
      viewTitle.textContent = 'New Account';
      viewSubtitle.textContent = 'Commissioning // Node Provisioning';

      // Footer
      switchPrompt.innerHTML = `<span>Already verified auditor?</span> <button type="button" onclick="switchAuthMode('signin')" class="font-headline-sm text-headline-sm text-primary hover:underline">Sign In</button>`;
    }
  }

  function togglePassVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function simulateAuth(type) {
    const title = document.getElementById('view-title');
    const prev = title.textContent;
    title.textContent = type === 'signin' ? 'Authenticating...' : 'Provisioning...';
    setTimeout(() => {
      title.textContent = prev;
    }, 1200);
  }

  function notifyForgot() {
    const subtitle = document.getElementById('view-subtitle');
    subtitle.textContent = 'Recovery Key Dispatched to Facility Host';
    setTimeout(() => {
      subtitle.textContent = 'Node Console // Facility Gateway';
    }, 2500);
  }
</script></main>

</body></html>
