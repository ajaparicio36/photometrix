"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface"><div class="flex flex-col w-full min-h-[92vh] justify-between items-center px-6 relative select-none">

        Photometrix</h1>
<!-- Monospace Calibration Version Identifier -->

<p class="font-label-code text-label-code text-on-surface-variant tracking-wider uppercase">lighting compliance monitor</p>

<div class="w-full max-w-xs z-10 pb-10 flex flex-col items-center">

<!-- Dual Domain Calibration Progress Track -->
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden p-0 relative">
<div class="h-full rounded-full bg-gradient-to-r from-secondary via-secondary-container to-secondary transition-all duration-1000 ease-out relative" id="telemetry-progress-bar" style="width: 96%;">
<!-- Glint Highlight -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent animate-pulse"></div>
</div>
</div>
<!-- Precision Telemetry Status Footer -->

</div>
</div>
<script>
  // Subtle interactive micro-loading ping for high-precision tactile feel
  (function initTelemetrySplash() {
    const bar = document.getElementById('telemetry-progress-bar');
    const label = document.getElementById('telemetry-progress-val');
    if (!bar || !label) return;

    let progress = 68;
    const interval = setInterval(() => {
      if (progress < 96) {
        progress += Math.floor(Math.random() * 4) + 1;
        if (progress > 96) progress = 96;
        bar.style.width = progress + '%';
        label.textContent = progress + '%';
      } else {
        clearInterval(interval);
      }
    }, 450);
  })();
</script></main>
